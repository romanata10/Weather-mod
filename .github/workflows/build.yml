name: Build Forge mod
on:
  push:
    branches: ['arena/5774b227-weather-mod']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'
      - name: Build JAR
        shell: bash
        run: |
          gradle build --stacktrace --no-daemon > gradle-build.log 2>&1 || {
            tail -100 gradle-build.log
            while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done < <(tail -100 gradle-build.log)
            exit 1
          }
          tail -30 gradle-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: extremeweather-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
