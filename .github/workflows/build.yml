name: Build Forge mod
on:
  push:
    branches: ['arena/5774b227-weather-mod']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'
          cache-disabled: true
      - name: Build JAR
        shell: bash
        run: |
          gradle build --no-daemon > gradle-build.log 2>&1 || {
            tail -45 gradle-build.log
            while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done < <(grep -E "(^> |FAILURE:|What went wrong|error:|Could not|Caused by:|Exception|symbol:|location:|^\*|^Build file|^Execution failed)" gradle-build.log | tail -15)
            exit 1
          }
          tail -30 gradle-build.log
      - name: Inspect PMWeather 0.16.4 extension points
        shell: bash
        run: |
          JAR=$(find "$HOME/.gradle" -type f \( -iname '*weather*.jar' -o -iname '*protomanly*.jar' \) ! -iname '*api*' | head -1)
          echo "::notice::PMWeather jar candidate: $JAR"
          if [ -n "$JAR" ]; then
            for CLASS in dev.protomanly.pmweather.weather.Storm dev.protomanly.pmweather.weather.Vorticy dev.protomanly.pmweather.weather.storms.StormTypes; do
              DATA=$(javap -public -classpath "$JAR" "$CLASS" 2>&1 | grep -E '(public|class|static)' | head -75)
              DATA=${DATA//'%'/'%25'}; DATA=${DATA//$'\n'/'%0A'}
              echo "::notice::$CLASS%0A$DATA"
            done
          else
            echo '::warning::PMWeather jar not located in Gradle cache'
          fi
      - name: Dedicated server smoke test
        shell: bash
        run: |
          mkdir -p runserver
          printf 'eula=true\n' > runserver/eula.txt
          timeout 180s gradle runServer --no-daemon > runserver-smoke.log 2>&1 || true
          if ! grep -E 'Done \([0-9.]+s\)!|Done \([0-9.]+s\)! For help' runserver-smoke.log; then
            tail -90 runserver-smoke.log
            echo '::error::Dedicated server did not reach the ready state'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: extremeweather-pm-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish preview JAR to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'extremeweather-*.jar' ! -name '*-sources.jar' | head -1)
          test -n "$JAR"
          if gh release view v2.0.0-preview >/dev/null 2>&1; then
            gh release upload v2.0.0-preview "$JAR" --clobber
          else
            gh release create v2.0.0-preview "$JAR" --target "$GITHUB_SHA" --prerelease \
              --title 'Extreme Weather PM Addon 2.0.0 Preview (NeoForge 1.21.1)' \
              --notes 'Experimental preview. Requires Minecraft 1.21.1 + NeoForge 21.1, PMWeather 0.16.4-alpha, PMWeatherAPI 0.16.4.1 and this addon on both client and server. Back up your world before enabling block destruction or flooding. See README for unfinished features.'
          fi
