name: Build NeoForge PM Addon
on:
  push:
    branches: ['arena/5774b227-weather-mod']
  workflow_dispatch:
concurrency:
  group: weather-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Gradle 8.8 from pinned GitHub release
        shell: bash
        run: |
          curl --fail --location --retry 3 --retry-all-errors --retry-delay 3 \
            'https://downloads.gradle.org/distributions/gradle-8.8-bin.zip' \
            --output /tmp/gradle-8.8-bin.zip || \
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            'https://github.com/gradle/gradle-distributions/releases/download/v8.8.0/gradle-8.8-bin.zip' \
            --output /tmp/gradle-8.8-bin.zip
          unzip -q /tmp/gradle-8.8-bin.zip -d /tmp
          echo /tmp/gradle-8.8/bin >> "$GITHUB_PATH"
          /tmp/gradle-8.8/bin/gradle --version
      - name: Build JAR
        shell: bash
        run: |
          gradle build --no-daemon > gradle-build.log 2>&1 || {
            tail -45 gradle-build.log
            while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done < <(grep -E "(^> |FAILURE:|What went wrong|error:|Could not|Caused by:|Exception|symbol:|location:|^\*|^Build file|^Execution failed)" gradle-build.log | tail -15)
            exit 1
          }
          tail -30 gradle-build.log
      - name: Validate runtime PMWeather particle textures
        shell: bash
        run: |
          JAR=$(find "$HOME/.gradle" -type f -name 'protomanlys-weather-*.jar' | head -1)
          test -n "$JAR"
          {
            python3 - "$JAR" <<'PYVALIDATE'
          import json,sys,zipfile,pathlib
          jar=zipfile.ZipFile(sys.argv[1]); names=set(jar.namelist())
          for path in pathlib.Path('src/main/resources/assets/extremeweather/particles').glob('*.json'):
              for texture in json.loads(path.read_text())['textures']:
                  namespace,name=texture.split(':',1)
                  assert f'assets/{namespace}/textures/particle/{name}.png' in names, texture
          print('PMWeather particle texture resource IDs validated against dependency JAR')
          PYVALIDATE
          }
      - name: Dedicated server and PMWeather command integration test
        shell: bash
        run: |
          mkdir -p runserver
          RCON_PASSWORD=$(openssl rand -hex 16)
          printf 'eula=true\n' > eula.txt
          printf 'eula=true\n' > runserver/eula.txt
          printf 'enable-rcon=true\nrcon.port=25575\nrcon.password=%s\nserver-port=25566\nonline-mode=false\n' "$RCON_PASSWORD" > runserver/server.properties
          tail -f /dev/null | timeout 180s gradle runServer --no-daemon > runserver-smoke.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 150); do
            if grep -Eq 'Done \([0-9.]+s\)!' runserver-smoke.log; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            tail -90 runserver-smoke.log
            echo '::error::Dedicated server did not reach ready state'
            exit 1
          fi
          echo "Server configs: $(find . -name server.properties -print | head -5)"
          grep -Ei '(RCON|Done \(|Starting Minecraft server|Preparing level|EULA)' runserver-smoke.log | tail -12 || true
          python3 scripts/rcon_smoke.py "$RCON_PASSWORD" > rcon-smoke.log 2>&1 || {
            cat rcon-smoke.log
            while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done < <(tail -12 rcon-smoke.log)
            echo "::error::Server properties: $(find . -name server.properties -print | head -5)"
            echo "::error::Ready marker: $(grep -n 'Done (' runserver-smoke.log | tail -2)"
            while IFS= read -r line; do
              line=${line//'%'/'%25'}; line=${line//$'\r'/'%0D'}; line=${line//$'\n'/'%0A'}
              echo "::error::$line"
            done < <(grep -Ei '(RCON|Done \(|Starting Minecraft server|server.properties|EULA|Stopping server|ERROR|WARN)' runserver-smoke.log | tail -14)
            tail -50 runserver-smoke.log
            exit 1
          }
          cat rcon-smoke.log
      - name: Optional in-world raymarch client probe (must connect to count)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if ! command -v xvfb-run >/dev/null; then
            echo '::warning::Xvfb not present; in-world client rendering untested'
            exit 1
          fi
          mkdir -p runserver-visual
          RCON_PASSWORD=$(openssl rand -hex 16)
          printf 'eula=true\n' > runserver-visual/eula.txt
          printf 'enable-rcon=true\nrcon.port=25576\nrcon.password=%s\nserver-port=25567\nonline-mode=false\nallow-flight=true\nlevel-type=minecraft:flat\n' "$RCON_PASSWORD" > runserver-visual/server.properties
          timeout 300s gradle runServer -PserverRunDir=runserver-visual --no-daemon > visual-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" "${CLIENT_PID:-}" 2>/dev/null || true' EXIT
          READY=0
          for attempt in $(seq 1 140); do
            if grep -Eq 'Done \([0-9.]+s\)!' visual-server.log; then READY=1; break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then tail -65 visual-server.log; exit 1; fi
          # A fresh client otherwise pauses on the first-launch accessibility
          # screen BEFORE Quick Play attempts to contact our dedicated server.
          mkdir -p run
          printf 'version:3955\nnarrator:0\nonboardAccessibility:false\nskipMultiplayerWarning:true\n' > run/options.txt
          cp run/options.txt options.txt
          timeout 220s xvfb-run -a -s '-screen 0 1280x720x24' bash -c '
            gradle runClient -PclientJoinAddress=127.0.0.1:25567 --no-daemon > client-smoke.log 2>&1 &
            GAME=$!
            python3 -m pip install --quiet pillow > capture-install.log 2>&1 || true
            for attempt in $(seq 1 170); do
              if [ -f baseline-now ]; then
                python3 scripts/capture_client.py client-baseline.png > baseline-capture.log 2>&1 || true
                rm baseline-now
              fi
              if [ -f capture-now ]; then
                sleep 0.2
                python3 scripts/capture_client.py > capture.log 2>&1 || true
                break
              fi
              sleep 1
            done
            wait "$GAME"
          ' &
          CLIENT_PID=$!
          python3 scripts/rcon_client_probe.py "$RCON_PASSWORD" > probe.log 2>&1 || {
            cat probe.log;tail -55 client-smoke.log;tail -30 visual-server.log;exit 1;
          }
          cat probe.log
          FOUND=0
          for attempt in $(seq 1 30); do
            if grep -Fq 'ExtremeWeather dust volume rendered with world GUI visible' client-smoke.log; then FOUND=1; break; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$FOUND" -ne 1 ]; then
            tail -75 client-smoke.log
            echo '::warning::Real client did not report drawing the dust volume'
            exit 1
          fi
          echo '::notice::Client DustVolumeParticle.render executed in a joined Minecraft world.'
          # Capture immediately after the shader particle is observed in-world,
          # not a minute later when the short-lived vortex has expired.
          touch capture-now
          for attempt in $(seq 1 25); do
            if [ -f client-screen.png ]; then break; fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ ! -f client-screen.png ]; then
            echo '::warning::In-world render called, but framebuffer capture failed'
            exit 1
          fi
          echo 'Client renderer executed and framebuffer captured; appearance still needs review.'
      - name: Summarize in-world client probe for review
        if: always()
        shell: bash
        run: |
          if [ -f probe.log ]; then
            DATA=$(tail -10 probe.log); DATA=${DATA//$'\n'/'%0A'}
            echo "::notice::RCON probe%0A$DATA"
          fi
          if [ -f client-smoke.log ]; then
            if grep -Fq 'ExtremeWeather dust volume rendered with world GUI visible' client-smoke.log; then
              echo '::notice::Real Minecraft client called DustVolumeParticle.render in-world'
            fi
            DATA=$(grep -Ei '(quick.?play|connect|join|extremeweather|failed|exception|server address|asset|missing)' client-smoke.log | grep -vi 'ALSA lib' | tail -16 || true)
            DATA=${DATA//$'\n'/'%0A'}
            echo "::notice::Client connection/shader events%0A$DATA"
            DATA=$(grep -viE 'ALSA lib|OpenAL|pa_alsa|pulseaudio' client-smoke.log | tail -13 || true)
            DATA=${DATA//$'\n'/'%0A'}
            echo "::notice::Client log tail%0A$DATA"
          fi
          if [ -f client-screen.png ]; then
            echo "::notice::Captured headless client screen ($(wc -c < client-screen.png) bytes)"
            python3 scripts/compare_client_screens.py || echo '::warning::Client framebuffer comparison unavailable'
            python3 scripts/annotate_client_screen.py || echo '::warning::Could not compress framebuffer preview for annotations; artifact still contains full PNG' 
            if command -v tesseract >/dev/null; then
              TEXT=$(tesseract client-screen.png stdout 2>/dev/null | head -35 || true)
              TEXT=${TEXT//$'\n'/'%0A'}
              echo "::notice::Client screen OCR%0A$TEXT"
            fi
          else
            echo "::warning::Client screen capture unavailable: $(cat capture.log 2>/dev/null | head -3)"
          fi
          if [ -f visual-server.log ]; then
            DATA=$(grep -Ei '(Done \(|joined the game|left the game|disconnect|error|exception)' visual-server.log | tail -9 || true)
            DATA=${DATA//$'\n'/'%0A'}
            echo "::notice::Server connection events%0A$DATA"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-client-screen
          path: |
            client-screen.png
            client-baseline.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: extremeweather-pm-neoforge-1.21.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish preview JAR to GitHub Releases
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(find build/libs -maxdepth 1 -name 'extremeweather-*.jar' ! -name '*-sources.jar' | head -1)
          test -n "$JAR"
          if gh release view v2.3.0-preview >/dev/null 2>&1; then
            gh release upload v2.3.0-preview "$JAR" --clobber
          else
            gh release create v2.3.0-preview "$JAR" --target "$GITHUB_SHA" --prerelease \
              --title 'Extreme Weather PM Addon 2.3.0 Preview (NeoForge 1.21.1)' \
              --notes 'Experimental preview. Requires Minecraft 1.21.1 + NeoForge 21.1, PMWeather 0.16.4-alpha, PMWeatherAPI 0.16.4.1 and this addon on both client and server. Single native tornado without an added silhouette; PMWeather-cloud-gated sprites and small water whirlpools; server-tested wildfire and flood water. Client graphics and full 17-feature specification NOT verified. Back up your world; see README for limits.'
          fi
