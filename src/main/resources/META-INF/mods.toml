[[mods]]
modId="extremeweather"
version="1.0.0"
displayName="Extreme Weather: Storms & Disasters"
authors="Arena"
description='''
Extreme Weather adds a full server-side weather simulation and cinematic rendering to Minecraft 1.20.1 (Forge):

* volumetric style cloud decks, towering cumulonimbus anvils and rotating mesocyclones
* thunderstorms, multi-cells and supercells with real tornado probability (EF0 - EF5)
* every tornado shape: rope, cone, stove pipe, barrel, wedge, multi-vortex, "dead man walking" and the record sized El Reno monsters
* dust devils on hot days, landspouts, waterspouts, gustnadoes, snow whirls and wildfire driven fire whirls
* hurricanes / typhoons / cyclones over warm oceans with spiral rain bands, storm surge, flooding and tsunamis
* damaging hail, rainbows, ocean wave simulation, red sprites, ball lightning, hyper lightning and other rare discharges
* spreading wildfires with giant smoke plumes and smoke curtains
* new decorative and fully functional blocks: weather radar, storm siren, anemometer, barometer, storm anchor, weather controller and more

Every feature is configurable. Use /ew ... to spawn phenomena manually.
'''

[[dependencies.extremeweather]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.extremeweather]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
